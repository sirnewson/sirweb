                                    <button onClick={() => handleWhatsAppClick(isEcommerce ? `Hi, I'm interested in the ${pkg.title} (E-Commerce) package for ${kes} KES ($${usd} USD).` : `Hi, I'm interested in the ${pkg.title} package for ${kes} KES ($${usd} USD).`)} className={`w-full py-3 rounded-lg font-semibold transition-all duration-300 ${pkg.highlight ? 'bg-orange-500 text-white hover:bg-orange-600 shadow-lg shadow-orange-500/25' : 'bg-slate-700 text-white hover:bg-slate-600'}`}>{isEcommerce ? 'Get E-Commerce' : 'Get Website'}</button>
